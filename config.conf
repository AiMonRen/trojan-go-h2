# ============================================================
# Trojan-Go 节点部署配置文件
# ============================================================
# 用法: sudo bash install.sh --config=/path/to/config.conf --master|--worker
# ============================================================

# ============================================================
# 基础配置（必填）
# ============================================================

# 主节点域名
# - 主节点模式：填写本节点域名
# - 从节点模式：填写主节点域名
master=your.domain.com

# 从节点域名
# - 主节点模式：固定填写 no
# - 从节点模式：填写本节点域名
worker=no

# 节点认证密钥
# - 主节点模式：固定填写 no（部署后自动生成）
# - 从节点模式：填写主节点生成的密钥字符串
secret=no

# 管理员邮箱（用于 SSL 证书申请和告警通知）
email=admin@example.com

# ============================================================
# 高级配置（可选，保持默认值即可）
# ============================================================

# Trojan 监听端口（默认 443 TCP）
trojan_port=443

# WebSocket 启用（true/false，默认 false）
ws_enabled=false

# WebSocket 路径（默认 /trojan-go）
ws_path=/trojan-go

# Hysteria2 启用（true/false，默认 true）
hy2_enabled=true

# Hysteria2 端口（默认 443 UDP，与 TCP 443 不冲突）
hy2_port=443

# Hysteria2 伪装 URL
hy2_masquerade=https://www.bilibili.com

# Hysteria2 上行带宽 Mbps
hy2_up_mbps=100

# Hysteria2 下行带宽 Mbps
hy2_down_mbps=500

# 数据库类型（默认 mysql）
db_type=mysql

# MySQL 部署模式（docker/local，默认 docker）
# - docker: 自动部署 Docker MySQL 容器
# - local: 使用已存在的 MySQL 实例
mysql_deploy=docker

# Docker MySQL 配置（仅 mysql_deploy=docker 时有效）
mysql_docker_name=trojan-mysql
mysql_docker_root_password=AutoGenerate
mysql_docker_port=3306

# MySQL 连接配置
mysql_host=127.0.0.1
mysql_port=3306
mysql_user=trojan
mysql_password=AutoGenerate
mysql_dbname=trojan_go

# 节点同步间隔（秒，默认 60）
sync_interval=60

# 管理员用户名（默认 admin）
admin_username=admin

# 管理员密码（默认 AutoGenerate 自动生成）
admin_password=AutoGenerate
